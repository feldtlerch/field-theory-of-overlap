[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "style", style = "strong", children = [{ kind = "text", decoded = "Ties." }] }, { kind = "space", space = "en-space" }, { kind = "text", decoded = "Start with two lives. If something happens to one and nothing at all happens to the other, there is no tie between them. If your bad harvest becomes partly my hard winter — if your fate moves mine — there is. That is the theory’s whole starting point: a relationship is a channel through which fate travels, whatever either party feels about it. Feelings matter, but they are a reading of the channel, not the channel itself." }]

[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "text", decoded = "Every tie invites two different questions. " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "Which way does it lean?" }] }, { kind = "text", decoded = " — when things go well for you, is that good news or bad news for me? And " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "how much rides on it?" }] }, { kind = "text", decoded = " — how much of my fate actually moves when yours does? These are not the same question. A holiday friendship and a marriage can lean the same way; they do not carry the same weight. A rivalry can carry enormous weight and lean against. And two further splits ride under those. A tie has a standing lean, and each act has a lean of its own; a well-leaning friend can land an ill-leaning act — the promotion that genuinely delights him and quietly drowns you out. And “how much rides on it” is itself two questions: what " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "could" }] }, { kind = "text", decoded = " move through the tie, and what an act actually " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "did" }] }, { kind = "text", decoded = " move. You are answerable wherever something could move; you are charged for what did. Keeping direction and amount apart sounds like a small habit; most of what this theory corrects in common sense follows from refusing, ever, to blur them." }]

[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "style", style = "strong", children = [{ kind = "text", decoded = "Work." }] }, { kind = "space", space = "en-space" }, { kind = "text", decoded = "Left alone, ties loosen. When a tie stays strong for years, that is not stillness; someone is spending effort against the loosening, continuously, the way a hand holds a glass steady on a tilting table. And here is the fine and strange part: a photograph of the glass cannot tell you whether it is simply sitting there or being held against a push. But a " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "film" }] }, { kind = "text", decoded = " can: a held glass trembles — maintenance leaves a signature wobble that mere sitting does not have, and a patient camera can read it. So the faithful work is not invisible after all; watch long enough and you can see " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "that" }] }, { kind = "text", decoded = " a tie is being held. What no camera, however patient, will ever show is what the holding " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "costs the hand" }] }, { kind = "text", decoded = " — by what private weighing of goods the holder counts this tie worth its effort. The record can be given better and better instruments, and the theory welcomes every one; each removes something from the dark. What remains at the end is not a smaller version of the same shadow but a different kind of darkness: not the work, which trembles visibly, but the wage — the price the holder pays in a currency no one else can read. Any honest accounting of people must admit a blind spot in that exact place — and must refuse to read “no visible price” as “no price.”" }]

[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "style", style = "strong", children = [{ kind = "text", decoded = "Help and cost." }] }, { kind = "space", space = "en-space" }, { kind = "text", decoded = "Any act can be sorted by two questions: what did it do to the other person, and what did it do to your own life? Each answer can be " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "helped" }] }, { kind = "text", decoded = ", " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "untouched" }] }, { kind = "text", decoded = ", or " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "harmed" }] }, { kind = "text", decoded = " — nine kinds of act in all, laid out in the first table below. The four cells where no one is harmed and nothing is drained gather in the top-left: the " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "bright square" }] }, { kind = "text", decoded = ", where nothing needs an excuse. The five remaining cells — the whole harmed column plus the whole drained row — run along the right and bottom edges: a " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "backwards L" }] }, { kind = "text", decoded = ". The second table shows the shape bare. The L is where excuses live. One of the theory’s sharpest results, said plainly: the lies people tell themselves operate only on the L. Honest good is often foggy — you rarely know just how good you are — but the fog over the bright square hides nothing. Active self-deception, as this theory defines it, is the repainting of an L-cell as a bright one — the definition draws the boundary, and the result is that the boundary can be drawn at all." }]
