[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "text", decoded = "At the end, the whole theory stands on two feet — and names what they stand on. The feet are two tenses of one verb, " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "spend" }] }, { kind = "text", decoded = ". The first is the " }, { kind = "style", style = "strong", children = [{ kind = "text", decoded = "spent-privately" }] }, { kind = "text", decoded = ": the kernel, where rates are held at rest and converters are spent into no public record — the hand on the glass, readable, if ever, through the holder’s own biography. The second is the " }, { kind = "style", style = "strong", children = [{ kind = "text", decoded = "not-yet-spent" }] }, { kind = "text", decoded = ": the anchor, where time, independence, and cross-colour convergence may eventually sort fact from forgery — in arrears. There is no third foot. But there is a third tense, and it is not a foot; it is the " }, { kind = "style", style = "strong", children = [{ kind = "text", decoded = "ground" }] }, { kind = "text", decoded = ": the unspendable — the converter spent into no currency at all, the duty kept from bind rather than pull. That is not slow to read. There is nothing to read, by type. The record’s instruments climb their ladder — persistence, trembling, release, circulation — and every rung removes something from the dark and nothing from this residue. A well-founded darkness is not a retreating shadow; it is a fixed complement, and the paper can point to its exact boundary." }]

[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "text", decoded = "The paper also names the one wall its whole genealogy keeps hitting: economics is the science of everything representable as motion on a posted landscape of rewards, and this theory is a theory of the remainder. The remainder has two parts. One turns and can be instrumented — the tremor, the spiral, the wave. One holds and can only be funded — the will. One remainder you can watch; one you can only pay for." }]

