title = [{ kind = "text", decoded = "Tests the Theory Can Fail" }]
label = "sec:explainer:falsifier"

[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "text", decoded = "The theory stakes its empirical standing on a ladder — three instruments, ordered cheapest first, all reading the same class of thing: the part of a tie’s dynamics that " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "turns" }] }, { kind = "text", decoded = " instead of merely growing or fading, which no story of “everyone just follows the payoff gradient” can produce. If relationships were only motion on a landscape of rewards, nothing would ever rotate. Rotation is therefore the theory’s chosen tripwire." }]

[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "text", decoded = "The cheapest rung needs no experiment at all, only a patient record of a " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "held" }] }, { kind = "text", decoded = " tie: if the dynamics have a turning part, the tremor of maintenance does not just jitter — it circulates, and two logged coordinates suffice to catch the circulation in the correlations. (One logged coordinate can never catch it; rotation needs a plane. The instruction “log two things, not one” is itself a falsifiable design principle.) The second rung is release: let a tie go, and if there is a turning part, it does not fade monotonically — it spirals, souring and rekindling at shrinking amplitude, with a fixed pitch. And the two rungs must " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "agree" }] }, { kind = "text", decoded = ": the circulation of the held tremor and the pitch of the released spiral read the same underlying turn, so their disagreement kills the model outright, not a parameter." }]
