[[unit.blocks]]
kind = "paragraph"
runs = [{ kind = "text", decoded = "Accountability is about the channel and the charge, never the lean. If your action moves someone’s fate, you answer for the movement — even if you feel nothing, even if your feelings cancel, even if your private weighting hides the tie. The careless landlord who “feels nothing” for a tenant still holds the tenant’s winter in his hands; the not-feeling changes nothing about the holding. And the structure is cleanly two-stage: the " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "gate" }] }, { kind = "text", decoded = " is capacity — could anything move through this edge at all? — and it shuts only for the genuine stranger, where the channel itself is zero; the " }, { kind = "style", style = "emphasis", children = [{ kind = "text", decoded = "charge" }] }, { kind = "text", decoded = " is what this act actually moved. An act that happens to miss today, over a live channel, leaves you answerable still: the gate never consulted the act." }]

