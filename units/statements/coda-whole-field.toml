schema = 1

[unit]
id = "sec:coda:whole-field"
document = "paper-pilot"

[unit.math]
field = '\comovfield'

[unit.texts]
en = "To love is to hold another’s fate as partly your own; to be wise is to widen that holding without erasing the holder. The judge everyone can trust, the reporter who favours no one, and the self for whom every good act returns are not three but one, reached the one way the whole field points: by raising @math{field} toward all until your field is the whole field and you are enemy to none — folding every other’s goods by every other’s own measure — at the price, in the plural dimension of outcomes, of bearing all of it. And it can be counterfeited by anyone with funding enough to look beloved, so the last thing the field can do is the first thing it most needs: to tell the woven from the one only paid to seem so — which settles, if ever, in arrears, the only way unposted prices are ever read: spent, at a crossing, by other hands."
