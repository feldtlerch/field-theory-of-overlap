[unit.texts]
en = "This is not despair. It is discipline. Do not flatten direction into magnitude, capacity into realization, persons into scores, witnesses into crowds, facts into verdicts or verdicts into facts, love into preference, goodness into usefulness, or wisdom into self-sacrifice. Hold the distinctions, and the paper's eight welded words line up where they were earned: @virtue{wonder} reaches toward unknown surplus; @virtue{beauty} is wonder found; @virtue{goodness} enlarges real overlap; @virtue{kindness} is goodness at the modest scale; @virtue{love} draws the self along held edges; @virtue{wisdom} guards the boundary from exploitation and erasure; @virtue{truth} is anchored legibility against capture; @virtue{health} is the self-floor self-deception must not cross."
