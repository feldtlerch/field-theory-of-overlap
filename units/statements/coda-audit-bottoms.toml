[unit]
id = "sec:coda:audit-bottoms"
document = "paper-pilot"
math = {}

[unit.texts]
en = "The audit bottoms out here, for the framework’s own reasons (@see{app:self-limit}): no formalism contains the reading, no instrument reads the future at the instant — so the document, read, concludes its own audit has no formal close. This is not a weakness but the shape of the thing: it stands on exactly two feet, the unreadable-now and the settled-later, on a ground neither reaches."
