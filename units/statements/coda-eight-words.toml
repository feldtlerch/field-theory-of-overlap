[unit]
id = "sec:coda:eight-words"
document = "paper-pilot"
math = {}

[unit.texts]
en = "What the document welded, gathered — each word standing on the bone it was welded to: @virtue{wonder} and @virtue{beauty}, the will that crosses before the reward exists and what it finds on the far side; @virtue{goodness} and @virtue{kindness}, the enlargement that raises real overlap, the second its quiet form at the modest good; @virtue{love}, the overlap drawing the self-boundary along held edges, the only rule that funds the grenade; @virtue{wisdom}, the guard of the whole orthant boundary, refusing self-erasure on one wall and exploitation on the other; @virtue{truth}, anchored legibility built against the toll-keeper; and @virtue{health}, the self-floor, the boundary self-deception is defined as crossing."
