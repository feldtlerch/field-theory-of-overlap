[unit.texts]
en = "This first section says everything the theory says, once, in ordinary words. There are no symbols in it and no cross-references; the small-caps marker at the foot of a box or a table is a bookmark for later readers, never vocabulary. Every idea here returns later with its formal name attached. If you read nothing else, read this."
