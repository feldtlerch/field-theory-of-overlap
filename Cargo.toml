[workspace]
resolver = "2"
members = ["crates/ftoo_manifest", "crates/ftoo_codegen", "crates/ftoo_audit", "crates/ftoo_readings"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT-0"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Optimize SHA-256 in test builds: one support hash takes about 46 s without it and 6 s with it.
[profile.dev.package.sha2]
opt-level = 3
